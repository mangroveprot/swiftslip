<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>PDF module check</title>
    <style>
      body { font-family: system-ui, Arial, sans-serif; padding: 16px; }
      .log { background: #0f172a; color: #e2e8f0; padding: 12px; border-radius: 8px;
             font-family: ui-monospace, monospace; font-size: 12px; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <h1>PDF module check</h1>
    <div id="out" class="log">running…</div>

    <!-- A short sheet (one page) and a long sheet (must split across pages). -->
    <div id="short-sheet" class="print-sheet" style="width:794px;background:#fff;padding:24px;border:1px solid #000">
      <h2 style="margin:0 0 8px">SHORT FORM</h2>
      <table border="1" style="border-collapse:collapse;width:100%">
        <tr><td>Name</td><td>Juan Dela Cruz</td></tr>
        <tr><td>Position</td><td>Encoder</td></tr>
      </table>
    </div>

    <div id="long-sheet" class="print-sheet"
         style="width:794px;background:#fff;padding:24px;border:1px solid #000;margin-top:24px">
      <h2 style="margin:0 0 8px">LONG FORM</h2>
      <table border="1" style="border-collapse:collapse;width:100%;font-size:14px">
        <tbody id="long-body"></tbody>
      </table>
    </div>

    <!-- The LOA / DTR shape: the sheet sits inside a box that scales it down. -->
    <div class="loa-fitbox" style="height:200px;overflow:hidden;margin-top:24px">
      <div class="loa-fitsheet" style="width:794px;transform:scale(0.25);transform-origin:top left">
        <div id="fit-sheet" class="print-sheet"
             style="width:794px;background:#fff;padding:24px;border:1px solid #000">
          <h2 style="margin:0 0 8px">SCALED FORM</h2>
          <p>Hidden chrome below must be left out:</p>
          <p class="no-print" style="color:#c00">NO-PRINT MARKER 12345</p>
          <p>Visible body text</p>
        </div>
      </div>
    </div>

    <!-- The real editor shape: the sheet is only as wide as the preview column,
         not as wide as the paper. The saved PDF must ignore this width. -->
    <div id="narrow-sheet" class="print-sheet"
         style="width:340px;background:#fff;padding:20px;border:1px solid #000;margin-top:24px">
      <h2 style="margin:0 0 8px">NARROW COLUMN FORM</h2>
      <table border="1" style="border-collapse:collapse;width:100%">
        <tr><td>ID Number</td><td>2026-515</td></tr>
        <tr><td>Department</td><td>IT DEP/RGC Dipolog Sat Office</td></tr>
      </table>
    </div>

    <script type="module">
      const out = document.getElementById("out");
      const lines = [];
      const say = (line) => {
        lines.push(line);
        out.textContent = lines.join("\n");
      };

      // 60 rows filled from the real table markup, so each row is a real `tr`.
      const body = document.getElementById("long-body");
      for (let i = 1; i <= 60; i += 1) {
        const tr = document.createElement("tr");
        tr.innerHTML = `<td>Row ${i}</td><td>2026-10-${String((i % 28) + 1).padStart(2, "0")}</td><td>08:00 - 17:00</td>`;
        body.append(tr);
      }

      window.addEventListener("error", (e) => say("WINDOW ERROR: " + e.message));
      window.addEventListener("unhandledrejection", (e) => say("REJECTION: " + (e.reason?.message || e.reason)));

      try {
        const mod = await import("/src/lib/save-pdf.ts");
        say("import ok: " + Object.keys(mod).join(", "));
        say("fileName helper: " + mod.pdfFileName("SwiftSlip", "OT", "Juan Dela Cruz", 2026));

        // Capture the blob the module hands to the download link.
        let captured = null;
        const realCreate = URL.createObjectURL.bind(URL);
        URL.createObjectURL = (blob) => {
          captured = blob;
          return realCreate(blob);
        };
        const pageCount = async () => {
          const text = await captured.text();
          const m = text.match(/\/Count\s+(\d+)/g) || [];
          return { pages: m.join(" "), bytes: captured.size, type: captured.type };
        };

        const t0 = performance.now();
        await mod.saveElementAsPdf({ element: document.getElementById("short-sheet"), fileName: "check-short" });
        say("short sheet ok in " + Math.round(performance.now() - t0) + "ms -> " + JSON.stringify(await pageCount()));

        // Watch the off-screen stage: its width is the paper's content width,
        // so a 340px preview column must still be captured ~688px wide.
        const widths = [];
        const observer = new MutationObserver((records) => {
          for (const record of records) {
            for (const node of record.addedNodes) {
              if (node.nodeType === 1 && node.hasAttribute("data-pdf-stage")) {
                widths.push(Math.round(node.getBoundingClientRect().width));
              }
            }
          }
        });
        observer.observe(document.body, { childList: true });

        captured = null;
        const t3 = performance.now();
        await mod.saveElementAsPdf({ element: document.getElementById("narrow-sheet"), fileName: "check-narrow" });
        observer.disconnect();
        say("narrow sheet ok in " + Math.round(performance.now() - t3) + "ms -> " + JSON.stringify(await pageCount()));
        say("stage widths used: " + JSON.stringify(widths) + " (print content box = " + Math.round((210 - 14 - 14) * 96 / 25.4) + "px)");
        say("stage cleaned up: " + (document.querySelector("[data-pdf-stage]") === null));
        say("live sheet width untouched: " + document.getElementById("narrow-sheet").getBoundingClientRect().width);

        captured = null;
        const t1 = performance.now();
        await mod.saveElementAsPdf({ element: document.getElementById("long-sheet"), fileName: "check-long" });
        say("long sheet ok in " + Math.round(performance.now() - t1) + "ms -> " + JSON.stringify(await pageCount()));

        // Fit-wrapper check: the sheet is inside transform:scale(0.25).
        captured = null;
        const t2 = performance.now();
        await mod.saveElementAsPdf({ element: document.getElementById("fit-sheet"), fileName: "check-fit" });
        say("scaled sheet ok in " + Math.round(performance.now() - t2) + "ms -> " + JSON.stringify(await pageCount()));
        say("fit wrapper restored: " + document.querySelector(".loa-fitsheet").getAttribute("style"));

        URL.createObjectURL = realCreate;
        say("DONE");
      } catch (error) {
        say("FAILED: " + (error && error.message ? error.message : String(error)));
        say("stack: " + (error && error.stack ? error.stack.split("\n").slice(0, 4).join(" | ") : "-"));
      }
    </script>
  </body>
</html>
