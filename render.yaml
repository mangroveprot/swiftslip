# Render Blueprint for SwiftSlip: ONE Docker web service that serves both the
# website and the API (see ./Dockerfile).
#
# Dashboard: New -> Blueprint -> pick this repo. Render reads this file and
# creates the service; the `sync: false` values are asked for in the UI.
services:
  - type: web
    name: swiftslip
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # `free` sleeps when idle (first login takes 30s+). Use a paid plan for real use.
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TIME_ZONE
        value: Asia/Manila
      # The site's own public URL (web and API share one origin now).
      - key: CORS_ORIGIN
        value: https://regasco.dpdns.org
      # One proxy (Render's) sits in front, so the throttle reads X-Forwarded-For.
      - key: TRUST_PROXY
        value: "1"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: RGC_INVENTORY_DATABASE_URL
        sync: false
